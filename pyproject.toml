[project]
name = "deepagents-demo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.1.0",
    "langchain-openai>=1.0.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[tool.uv]
# deepagents 0.1.0 锁定 langchain-core==1.0.0，其 Reviver 不支持 allowed_objects 参数；
# langgraph-checkpoint 4.x 依赖该参数，会导致 import 阶段 TypeError，故限制在 3.x。
constraint-dependencies = ["langgraph-checkpoint<4"]
